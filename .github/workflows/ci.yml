name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile application
        run: python -m compileall -q app
      - name: Run test suite
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff
      # Syntax errors, undefined names and invalid comparisons only; stylistic
      # rules are intentionally not enforced.
      - name: Lint for real errors
        run: ruff check app tests --select E9,F63,F7,F82

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ensure a single Alembic head
        run: |
          heads=$(alembic heads | grep -c '(head)')
          echo "Alembic heads: $heads"
          test "$heads" -eq 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: harmony:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Synology runtime tools as mapped user
        run: docker run --rm --user 1026:100 harmony:ci deno --version
