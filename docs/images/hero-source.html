<!doctype html>
<!--
  Source for docs/images/hero.jpg. Render at a 1600x720 viewport with a
  device scale factor of 2 (for example with Playwright, allowing file access),
  then export as a 2400px-wide JPEG. Screenshots come from a demo library of
  fictional artists; Inter must be installed for the intended typography.
-->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:720px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#e7edf6;background:#070b14;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 12% 18%, rgba(45,212,191,.20), transparent 60%),
 radial-gradient(800px 600px at 88% 95%, rgba(129,140,248,.24), transparent 60%),
 radial-gradient(600px 400px at 70% 10%, rgba(45,212,191,.08), transparent 60%), #070b14}
.grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 30% 40%,#000 30%,transparent 75%)}
.copy{position:absolute;left:88px;top:118px;width:560px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:76px;height:76px;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.brand span{font-size:60px;font-weight:800;letter-spacing:-.045em}
h1{margin-top:34px;font-size:46px;line-height:1.08;font-weight:750;letter-spacing:-.035em}
h1 em{font-style:normal;background:linear-gradient(90deg,#5eead4,#818cf8);-webkit-background-clip:text;color:transparent}
p{margin-top:18px;font-size:19px;line-height:1.55;color:#a7b4c6;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;max-width:540px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(148,163,184,.22);border-radius:999px;background:rgba(17,26,42,.7);font-size:14.5px;font-weight:600;color:#cdd7e4}
.chip i{width:8px;height:8px;border-radius:50%;background:#2dd4bf;display:inline-block}
.chip:nth-child(2) i{background:#818cf8}.chip:nth-child(3) i{background:#f472b6}.chip:nth-child(4) i{background:#fbbf24}
.stage{position:absolute;left:690px;top:70px;width:1020px;height:640px;perspective:2200px}
.browser{position:absolute;left:0;top:0;width:1000px;border-radius:16px;overflow:hidden;border:1px solid rgba(148,163,184,.25);background:#0d1422;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;transform:rotateY(-14deg) rotateX(4deg) rotateZ(1deg);transform-origin:left center}
.bar{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0f1726;border-bottom:1px solid rgba(148,163,184,.15)}
.bar b{width:11px;height:11px;border-radius:50%;background:#3b475c;display:block}
.bar b:nth-child(1){background:#ff5f57}.bar b:nth-child(2){background:#febc2e}.bar b:nth-child(3){background:#28c840}
.bar .url{margin-left:18px;flex:0 0 360px;height:20px;border-radius:6px;background:#162034;color:#7d8ba0;font-size:11px;display:flex;align-items:center;padding-left:10px}
.browser img{display:block;width:1000px}
.phone{position:absolute;left:640px;top:150px;width:236px;padding:9px;border-radius:40px;background:#0b1120;border:1px solid rgba(148,163,184,.35);box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 0 2px #1a2335 inset;transform:rotateY(-10deg) rotateZ(2deg)}
.phone img{display:block;width:100%;border-radius:31px}
.glow{position:absolute;left:560px;top:420px;width:520px;height:260px;background:radial-gradient(closest-side,rgba(45,212,191,.25),transparent);filter:blur(20px)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="copy">
 <div class="brand"><img src="../../app/static/brand/harmony-icon.svg"><span>Harmony</span></div>
 <h1>Your music.<br><em>Your library. Your way.</em></h1>
 <p>Self-hosted music acquisition, playlist sync, and library management, built as the companion to Navidrome.</p>
 <div class="chips"><span class="chip"><i></i>Spotify &amp; YouTube Music</span><span class="chip"><i></i>Auto-synced M3U playlists</span><span class="chip"><i></i>Navidrome ready</span><span class="chip"><i></i>Docker · Synology NAS</span></div>
</div>
<div class="stage">
 <div class="glow"></div>
 <div class="browser"><div class="bar"><b></b><b></b><b></b><div class="url">harmony.local/library</div></div><img src="screenshots/desktop-albums.jpg"></div>
 <div class="phone"><img src="screenshots/mobile-dashboard.jpg"></div>
</div>
</body></html>
