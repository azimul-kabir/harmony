services:
  harmony:
    build: .
    container_name: harmony

    ports:
      - "8080:8080"

    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      AUTH_BOOTSTRAP_PASSWORD_FILE: ${AUTH_BOOTSTRAP_PASSWORD_FILE:-}
      AUTH_SESSION_SECRET_FILE: ${AUTH_SESSION_SECRET_FILE:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_ABSOLUTE_HOURS: ${AUTH_SESSION_ABSOLUTE_HOURS:-12}
      AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-60}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}

    volumes:
      - ./database:/database
      - ./logs:/logs
      - /volume1/music/library:/music
      - /volume1/music/incoming:/downloads
      # Mount secret files read-only, for example:
      # - ./secrets:/run/secrets:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --proxy-headers
      --forwarded-allow-ips=${AUTH_TRUSTED_PROXIES:-127.0.0.1}
