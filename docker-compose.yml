services:
  harmony:
    build: .
    container_name: harmony

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ./database:/database
      - ./logs:/logs
      - ${MUSIC_HOST_PATH:-/volume1/music/library}:/music
      - ${DOWNLOAD_HOST_PATH:-/volume1/music/incoming}:/downloads
      - ./secrets:/run/secrets:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --proxy-headers
      --forwarded-allow-ips=${AUTH_TRUSTED_PROXIES:-127.0.0.1}
