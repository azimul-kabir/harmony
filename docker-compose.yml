services:
  harmony:
    build: .
    container_name: harmony

    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - ${HARMONY_DATABASE_DIR:-./database}:/database
      - ${HARMONY_LOG_DIR:-./logs}:/logs
      - ${HARMONY_MUSIC_DIR:-./music}:/music
      - ${HARMONY_DOWNLOAD_DIR:-./downloads}:/downloads

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
