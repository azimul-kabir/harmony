services:
  harmony:
    build: .
    container_name: harmony

    ports:
      - "8080:8080"

    environment:
      WEB_AUTH_USERNAME: ${WEB_AUTH_USERNAME:-admin}
      WEB_AUTH_PASSWORD: ${WEB_AUTH_PASSWORD:?Set WEB_AUTH_PASSWORD in .env}
      WEB_AUTH_SECURE_COOKIE: ${WEB_AUTH_SECURE_COOKIE:-false}

    volumes:
      - ./database:/database
      - ./logs:/logs
      - /volume1/music/library:/music
      - /volume1/music/incoming:/downloads

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
